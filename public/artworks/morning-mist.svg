<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde8f0"/>
      <stop offset="60%" stop-color="#e8eff5"/>
      <stop offset="100%" stop-color="#ece5d5"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5f0e6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <!-- horizon bands suggesting mist -->
  <rect x="0" y="340" width="900" height="8" fill="rgba(180,200,215,0.4)"/>
  <rect x="0" y="360" width="900" height="12" fill="rgba(180,200,215,0.25)"/>
  <rect x="0" y="390" width="900" height="6" fill="rgba(180,200,215,0.2)"/>
  <!-- distant tree line -->
  <ellipse cx="180" cy="338" rx="70" ry="30" fill="rgba(80,110,90,0.18)"/>
  <ellipse cx="280" cy="335" rx="90" ry="35" fill="rgba(80,110,90,0.15)"/>
  <ellipse cx="420" cy="340" rx="110" ry="28" fill="rgba(80,110,90,0.12)"/>
  <ellipse cx="600" cy="337" rx="95" ry="32" fill="rgba(80,110,90,0.16)"/>
  <ellipse cx="760" cy="340" rx="80" ry="26" fill="rgba(80,110,90,0.14)"/>
  <!-- water surface -->
  <rect x="0" y="400" width="900" height="200" fill="rgba(200,215,225,0.5)"/>
  <rect x="0" y="400" width="900" height="200" fill="url(#mist)"/>
  <!-- gentle water lines -->
  <line x1="60" y1="430" x2="280" y2="430" stroke="rgba(180,200,215,0.5)" stroke-width="1"/>
  <line x1="150" y1="455" x2="400" y2="455" stroke="rgba(180,200,215,0.4)" stroke-width="1"/>
  <line x1="500" y1="435" x2="780" y2="435" stroke="rgba(180,200,215,0.4)" stroke-width="1"/>
  <line x1="100" y1="480" x2="450" y2="480" stroke="rgba(180,200,215,0.3)" stroke-width="1"/>
  <line x1="400" y1="510" x2="820" y2="510" stroke="rgba(180,200,215,0.3)" stroke-width="1"/>
  <!-- outer frame -->
  <rect x="1" y="1" width="898" height="598" stroke="rgba(28,26,23,0.12)" stroke-width="1.5" fill="none"/>
  <!-- inner decorative frame -->
  <rect x="20" y="20" width="860" height="560" stroke="rgba(184,148,63,0.2)" stroke-width="1" fill="none" stroke-dasharray="3 5"/>
  <!-- placeholder label -->
  <text x="450" y="570" text-anchor="middle" font-family="sans-serif" font-size="9" letter-spacing="5" fill="rgba(28,26,23,0.25)">REPLACE WITH ARTWORK IMAGE</text>
</svg>

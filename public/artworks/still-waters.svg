<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ece6"/>
      <stop offset="100%" stop-color="#d0dbd2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dbcaa"/>
      <stop offset="100%" stop-color="#6a9980"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <!-- sky -->
  <rect x="0" y="0" width="900" height="300" fill="rgba(200,215,205,0.5)"/>
  <!-- distant hills -->
  <ellipse cx="200" cy="300" rx="260" ry="80" fill="rgba(80,120,90,0.3)"/>
  <ellipse cx="500" cy="295" rx="300" ry="70" fill="rgba(80,120,90,0.25)"/>
  <ellipse cx="780" cy="305" rx="200" ry="65" fill="rgba(80,120,90,0.28)"/>
  <!-- tree line -->
  <rect x="100" y="270" width="5" height="30" fill="rgba(40,70,50,0.5)"/>
  <ellipse cx="102" cy="270" rx="14" ry="18" fill="rgba(40,70,50,0.5)"/>
  <rect x="160" y="265" width="4" height="35" fill="rgba(40,70,50,0.45)"/>
  <ellipse cx="162" cy="265" rx="12" ry="16" fill="rgba(40,70,50,0.45)"/>
  <rect x="620" y="268" width="5" height="32" fill="rgba(40,70,50,0.45)"/>
  <ellipse cx="622" cy="268" rx="13" ry="17" fill="rgba(40,70,50,0.45)"/>
  <rect x="700" y="262" width="4" height="38" fill="rgba(40,70,50,0.5)"/>
  <ellipse cx="702" cy="262" rx="15" ry="19" fill="rgba(40,70,50,0.5)"/>
  <!-- water surface -->
  <rect x="0" y="300" width="900" height="300" fill="url(#water)" opacity="0.65"/>
  <!-- reflections on water -->
  <line x1="0" y1="320" x2="900" y2="320" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <line x1="0" y1="345" x2="900" y2="345" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="0" y1="375" x2="900" y2="375" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="0" y1="410" x2="900" y2="410" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="0" y1="450" x2="900" y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- ripple circles -->
  <ellipse cx="300" cy="380" rx="60" ry="8" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
  <ellipse cx="300" cy="380" rx="35" ry="4" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
  <ellipse cx="620" cy="430" rx="45" ry="6" stroke="rgba(255,255,255,0.18)" stroke-width="1" fill="none"/>
  <!-- outer frame -->
  <rect x="1" y="1" width="898" height="598" stroke="rgba(28,26,23,0.12)" stroke-width="1.5" fill="none"/>
  <rect x="20" y="20" width="860" height="560" stroke="rgba(80,120,90,0.2)" stroke-width="1" fill="none" stroke-dasharray="3 5"/>
  <text x="450" y="570" text-anchor="middle" font-family="sans-serif" font-size="9" letter-spacing="5" fill="rgba(28,26,23,0.2)">REPLACE WITH ARTWORK IMAGE</text>
</svg>

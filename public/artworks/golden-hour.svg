<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sun" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8c46a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#d4913a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a2510" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3e1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2a1508" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="#2a1508"/>
  <rect width="900" height="600" fill="url(#sun)"/>
  <!-- sun disc -->
  <circle cx="450" cy="240" r="52" fill="rgba(240,200,80,0.6)"/>
  <circle cx="450" cy="240" r="36" fill="rgba(250,220,100,0.7)"/>
  <!-- horizon glow -->
  <rect x="0" y="350" width="900" height="4" fill="rgba(220,160,50,0.5)"/>
  <!-- silhouetted ground / field -->
  <rect x="0" y="380" width="900" height="220" fill="url(#ground)"/>
  <!-- silhouetted trees -->
  <rect x="80" y="300" width="8" height="80" fill="rgba(20,10,5,0.85)"/>
  <ellipse cx="84" cy="300" rx="22" ry="30" fill="rgba(20,10,5,0.85)"/>
  <rect x="750" y="310" width="7" height="70" fill="rgba(20,10,5,0.8)"/>
  <ellipse cx="753" cy="310" rx="18" ry="25" fill="rgba(20,10,5,0.8)"/>
  <rect x="820" y="330" width="5" height="50" fill="rgba(20,10,5,0.75)"/>
  <ellipse cx="822" cy="330" rx="14" ry="20" fill="rgba(20,10,5,0.75)"/>
  <!-- light rays -->
  <line x1="450" y1="240" x2="0" y2="380" stroke="rgba(230,180,50,0.08)" stroke-width="40"/>
  <line x1="450" y1="240" x2="900" y2="380" stroke="rgba(230,180,50,0.08)" stroke-width="40"/>
  <!-- outer frame -->
  <rect x="1" y="1" width="898" height="598" stroke="rgba(184,148,63,0.3)" stroke-width="1.5" fill="none"/>
  <rect x="20" y="20" width="860" height="560" stroke="rgba(184,148,63,0.15)" stroke-width="1" fill="none" stroke-dasharray="3 5"/>
  <text x="450" y="570" text-anchor="middle" font-family="sans-serif" font-size="9" letter-spacing="5" fill="rgba(240,200,100,0.3)">REPLACE WITH ARTWORK IMAGE</text>
</svg>
